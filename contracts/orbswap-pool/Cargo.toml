[package]
name = "orbswap-pool"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Orbswap concentrated N-dim AMM pool contract (Soroban)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27"
orbswap-math = { path = "../orbswap-math" }
orbswap-pool-interface = { path = "../orbswap-pool-interface" }

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }
