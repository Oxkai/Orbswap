[package]
name = "orbswap-router"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Orbswap router — multi-hop swaps and liquidity helpers (Soroban)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27"
orbswap-pool-interface = { path = "../orbswap-pool-interface" }

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }
