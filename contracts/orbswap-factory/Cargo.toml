[package]
name = "orbswap-factory"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Orbswap factory — deploys and registers pool instances (Soroban)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27"
orbswap-pool-interface = { path = "../orbswap-pool-interface" }

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }
