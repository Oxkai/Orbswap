name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    # The cargo workspace lives in contracts/ (repo root holds contracts/, frontend/).
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and components.
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      # The factory/router test crates `contractimport!` the OPTIMIZED pool wasm (the
      # raw build exceeds Soroban's 128 KB code limit), so it must exist before clippy
      # or test even compile those crates. stellar-cli provides `contract optimize`.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install stellar-cli
        run: cargo binstall -y stellar-cli
        env:
          RUSTFLAGS: ""
      - name: Build + optimize pool wasm
        run: |
          cargo build --target wasm32v1-none --release -p orbswap-pool
          stellar contract optimize --wasm target/wasm32v1-none/release/orbswap_pool.wasm

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all
